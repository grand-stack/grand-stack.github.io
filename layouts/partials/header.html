<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" aria-label="GRANDstack home">
      <svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><g fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M9 22 L16 9 L23 22" /><path d="M9 22 H23" opacity=".55"/></g><circle cx="9" cy="22" r="3.4" fill="#006fd6"/><circle cx="16" cy="9" r="3.4" fill="#7c39c9"/><circle cx="23" cy="22" r="3.4" fill="#158838"/></svg>
      <span>grandstack</span>
    </a>
    <nav class="nav" aria-label="Main">
      {{- $current := . }}
      {{- range site.Menus.main }}
      <a href="{{ .URL }}"{{ if or ($current.RelPermalink | strings.HasPrefix .URL) }} aria-current="page"{{ end }}>{{ .Name }}</a>
      {{- end }}
      <a class="hide-sm" href="https://github.com/{{ site.Params.githubOrg }}">GitHub</a>
      <button class="icon-btn theme-toggle" type="button" aria-label="Toggle light and dark theme">
        <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </nav>
  </div>
</header>
