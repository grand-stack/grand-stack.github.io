<text x="295.0" y="407.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">sync, build, check, commit to main, deploy</text>
<rect x="580" y="350" width="360" height="90" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
