<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 560" width="1000" height="560" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">System overview of the default GRANDstack stack</title><desc id="d">The browser loads static files from the web container on port 3000, then sends GraphQL requests directly to the server on port 4000. The server translates each request to Cypher and talks to Neo4j over Bolt.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="558.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="36" y="190" width="190" height="130" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="131.0" y="212" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Browser</text>
<text x="131.0" y="232" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">React app (SPA)</text>
<text x="131.0" y="248" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">urql + typed operations</text>
<rect x="330" y="40" width="240" height="100" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5"/>
<text x="450.0" y="62" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">web  :3000</text>
<text x="450.0" y="82" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">nginx, static files only</text>
<text x="450.0" y="98" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">index.html + /assets</text>
<rect x="330" y="210" width="270" height="190" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="465.0" y="232" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">server  :4000</text>
<text x="465" y="255" font-size="13" font-weight="600" text-anchor="middle" fill="#0f2233">GraphQL Yoga</text>
<text x="465" y="276" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">@neo4j/graphql v7  (no resolvers)</text>
<rect x="350" y="300" width="230" height="40" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="465.0" y="322" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">counts plugin</text>
<text x="465" y="366" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">per-request context: driver, database, token</text>
<text x="465" y="384" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">CORS: only the web origin</text>
<rect x="760" y="210" width="204" height="190" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="862.0" y="232" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">neo4j</text>
<text x="862.0" y="252" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">community edition</text>
<text x="862.0" y="268" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Bolt :7687</text>
<text x="862.0" y="284" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Browser :7474</text>
<text x="862.0" y="300" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">volume neo4j-data</text>
<rect x="330" y="450" width="130" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
