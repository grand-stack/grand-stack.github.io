#
# Pull requests and pushes: unit tests, copyright headers, and a build and check of the committed docs copy.
name: ci
on:
  pull_request:
  push:
    branches: [main]
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
env:
  HUGO_VERSION: "0.164.0"
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/.github
          ref: v1
          path: .shared-ci
      - name: Keep the shared scripts out of the workspace
        run: mv .shared-ci "$RUNNER_TEMP/shared-ci"
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - name: Install Hugo
        run: |
          curl -fsSL -o hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
          tar -xzf hugo.tar.gz hugo && sudo mv hugo /usr/local/bin/
      - run: npm test
      - name: Copyright headers
        run: node "$RUNNER_TEMP/shared-ci/scripts/headers.mjs" --root . --check
      - run: hugo --gc --minify
      - run: npm run check
