name: ci
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Hugo
        run: |
          curl -sSL -o hugo.tar.gz https://github.com/gohugoio/hugo/releases/download/v0.164.0/hugo_extended_0.164.0_linux-amd64.tar.gz
          tar -xzf hugo.tar.gz hugo && sudo mv hugo /usr/local/bin/
          hugo version
      - uses: actions/setup-node@v4
        with: { node-version: 24 }
      - run: hugo --gc --minify
      - run: node scripts/check-site.mjs
