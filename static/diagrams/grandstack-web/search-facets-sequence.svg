<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">One Results operation returns the movies, the total and the counts for every filter option</title><desc id="d">A single GraphQL operation carries three where inputs: where with all active filters for the movies and the total, genreWhere with the filters minus genres for the genre counts, and decadeWhere with the filters minus decades for the decade counts.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="538.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="36" y="38" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">Three variables, one request</text>
<rect x="30" y="70" width="330" height="84" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="195.0" y="92" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">where</text>
<text x="195.0" y="112" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">all active filters</text>
<text x="195.0" y="128" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">-&gt; the results and the total</text>
<rect x="30" y="200" width="330" height="84" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="195.0" y="222" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">genreWhere</text>
<text x="195.0" y="242" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">the filters WITHOUT the genre filter</text>
<text x="195.0" y="258" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">-&gt; counts for each genre option</text>
<rect x="30" y="330" width="330" height="84" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="2.6"/>
<text x="195.0" y="352" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">decadeWhere</text>
<text x="195.0" y="372" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">the filters WITHOUT the decade filter</text>
<text x="195.0" y="388" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">-&gt; counts for each decade option</text>
<rect x="470" y="62" width="500" height="56" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="720.0" y="84" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">movies(where, sort, limit)</text>
<text x="720.0" y="103.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">fills the results grid</text>
<rect x="470" y="126" width="500" height="56" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="720.0" y="148" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">moviesConnection(where) { totalCount }</text>
<text x="720.0" y="167.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the "N movies" heading, and whether there is more</text>
<rect x="470" y="214" width="500" height="70" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="720.0" y="236" font-size="11.5" font-weight="650" text-anchor="middle" fill="#0f2233">genres { name  moviesConnection(where: { node: $genreWhere }) { totalCount } }</text>
<text x="720.0" y="255.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">one count per genre, as if the genre filter were off</text>
<rect x="470" y="316" width="500" height="98" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="720.0" y="338" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">d1940 ... d2020: nine aliased moviesConnection fields</text>
<text x="720.0" y="357.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">each = AND [ $decadeWhere, released in that decade ]</text>
<text x="720.0" y="373.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">one count per decade, as if the decade filter were off</text>
<path d="M 360 100 L 470 90" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 360 120 L 470 154" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 360 242 L 470 248" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 360 372 L 470 366" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<circle cx="30" cy="70" r="11" fill="#0a6190"/>
<text x="30" y="74.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<circle cx="30" cy="200" r="11" fill="#0a6190"/>
<text x="30" y="204.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="30" cy="330" r="11" fill="#0a6190"/>
<text x="30" y="334.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<rect x="30" y="450" width="940" height="62" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="42" y="472" font-size="12.5" font-weight="650" text-anchor="start" fill="#0f2233">Why "as if the filter were off"</text>
<text x="42" y="491.5" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569">ticking Drama still shows how many Crime films the other filters would give, so options are never hidden by their own selection; an option with 0 stays disabled</text>
<circle cx="30" cy="450" r="11" fill="#0a6190"/>
<text x="30" y="454.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="470" cy="316" r="11" fill="#0a6190"/>
<text x="470" y="320.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
</svg>
