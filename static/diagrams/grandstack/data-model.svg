<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 456" width="1000" height="456" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">Data model: movies, people, genres, reviews and users</title><desc id="d">Movie, Person and Genre nodes are connected by ACTED_IN (with roles), DIRECTED and IN_GENRE relationships. Review and User come from the auth extension. Two Person counts are stored but derived and refreshed after every mutation; Movie.similar and Person.collaborators are computed on request.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="454.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="40" y="30" width="240" height="190" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="160.0" y="52" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Person</text>
<text x="56" y="77.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">name  (unique key)</text>
<text x="56" y="93.5" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">born</text>
<rect x="56" y="111" width="208" height="30" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="160.0" y="133" font-size="12" font-weight="650" text-anchor="middle" fill="#0f2233">actedCount   stored, in sync</text>
<rect x="56" y="145" width="208" height="30" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="160.0" y="167" font-size="12" font-weight="650" text-anchor="middle" fill="#0f2233">directedCount   stored, in sync</text>
<rect x="56" y="179" width="208" height="34" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="201" font-size="12" font-weight="650" text-anchor="middle" fill="#0f2233">collaborators(limit)   computed</text>
<rect x="440" y="30" width="240" height="190" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="560.0" y="52" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Movie</text>
<text x="456" y="77" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">title  (unique key)</text>
<text x="456" y="94" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">tagline</text>
<text x="456" y="111" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">released</text>
<text x="456" y="128" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">rating  0-10</text>
<text x="456" y="145" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">runtime  minutes</text>
<rect x="456" y="175" width="208" height="34" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="197" font-size="12" font-weight="650" text-anchor="middle" fill="#0f2233">similar(limit)   computed</text>
<rect x="800" y="60" width="160" height="110" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="880.0" y="82" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Genre</text>
<text x="816" y="107.0" font-size="12.5" font-weight="400" text-anchor="start" fill="#0f2233">name  (unique key)</text>
<rect x="440" y="300" width="240" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="560.0" y="322" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Review</text>
<text x="456" y="342" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233">id, rating 1-10, text</text>
<text x="456" y="358" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233">createdAt  (ISO string)</text>
<rect x="40" y="310" width="240" height="76" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="160.0" y="332" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">User</text>
<text x="56" y="352" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233">sub (from the token), name</text>
<rect x="40" y="418" width="26" height="16" rx="4" fill="#fff4d6" stroke="#9a6700" stroke-width="1.3"/>
<text x="74" y="431" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569">stored property, kept in sync by the server</text>
<rect x="340" y="418" width="26" height="16" rx="4" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="374" y="431" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569">computed when requested</text>
<rect x="560" y="418" width="26" height="16" rx="4" fill="#ffffff" stroke="#64748b" stroke-width="1.3" stroke-dasharray="4 3"/>
<text x="594" y="431" font-size="11.5" font-weight="400" text-anchor="start" fill="#475569">exists only in the auth setup</text>
