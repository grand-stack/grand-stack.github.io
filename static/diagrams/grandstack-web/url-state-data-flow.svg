<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">In grandstack-web the URL is the single source of truth for filters</title><desc id="d">The query string is parsed into a Filters object, turned into typed GraphQL variables, sent with urql, and the typed result is rendered. When the user changes a filter, the new filters are written back to the URL, which re-runs the loop.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="518.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="30" y="80" width="200" height="96" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="2.6"/>
<text x="130.0" y="102" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">URL query string</text>
<text x="130.0" y="122" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">/movies?g=Drama&amp;d=1990</text>
<text x="130.0" y="138" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">&amp;r=8&amp;s=newest</text>
<rect x="290" y="80" width="200" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="390.0" y="102" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">Filters object</text>
<text x="390.0" y="122" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">q, genres, decades,</text>
<text x="390.0" y="138" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">minRating, maxRuntime,</text>
<text x="390.0" y="154" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">person, sort</text>
<rect x="550" y="80" width="210" height="96" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="655.0" y="102" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">GraphQL variables</text>
<text x="655.0" y="122" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">where, sort, limit,</text>
<text x="655.0" y="138" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">genreWhere, decadeWhere</text>
<rect x="820" y="60" width="150" height="56" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="895.0" y="82" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">urql</text>
<text x="895.0" y="102" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">typed document</text>
<rect x="820" y="140" width="150" height="56" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="1.5"/>
<text x="895.0" y="162" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">server</text>
<text x="895.0" y="182" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">POST /graphql</text>
<path d="M 230 128 L 290 128" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="260" y="114" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">parseFilters</text>
<path d="M 490 128 L 550 128" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="520" y="112" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">buildWhere</text>
<text x="520" y="154" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">buildSort</text>
<path d="M 760 100 L 820 90" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<path d="M 895 116 L 895 140" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<rect x="820" y="330" width="150" height="70" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="895.0" y="352" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">typed result</text>
<text x="895.0" y="372" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">movies, totals,</text>
<text x="895.0" y="388" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">facet counts</text>
<path d="M 895 196 L 895 330" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="912" y="270" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">JSON</text>
<rect x="500" y="310" width="260" height="110" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="2.6"/>
<text x="630.0" y="332" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">components</text>
<text x="630.0" y="352" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">Results page, FilterSidebar,</text>
<text x="630.0" y="368" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">MovieCard, chips</text>
<path d="M 820 365 L 760 365" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="790" y="352" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">render</text>
<rect x="30" y="330" width="200" height="70" rx="8" fill="#fff4d6" stroke="#9a6700" stroke-width="1.5"/>
<text x="130.0" y="352" font-size="14" font-weight="650" text-anchor="middle" fill="#0f2233">user changes a filter</text>
<text x="130.0" y="372" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">tick, slider, typing</text>
<path d="M 500 365 L 230 365" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="365" y="352" font-size="12" font-weight="400" text-anchor="middle" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">event</text>
<path d="M 130 330 L 130 176" fill="none" stroke="#64748b" stroke-width="1.8" marker-end="url(#arr)"/>
<text x="146" y="262" font-size="12" font-weight="400" text-anchor="start" fill="#0f2233" stroke="#f8fafc" stroke-width="4" stroke-linejoin="round" paint-order="stroke">serializeFilters + setSearchParams</text>
<rect x="290" y="446" width="330" height="50" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="455.0" y="468" font-size="12.5" font-weight="650" text-anchor="middle" fill="#0f2233">browser storage (only this)</text>
<text x="455.0" y="487" font-size="11" font-weight="400" text-anchor="middle" fill="#475569">compare list, theme: localStorage</text>
<text x="36" y="40" font-size="14" font-weight="700" text-anchor="start" fill="#0f2233">One loop: URL -&gt; filters -&gt; variables -&gt; server -&gt; screen -&gt; URL</text>
<circle cx="30" cy="80" r="11" fill="#0a6190"/>
