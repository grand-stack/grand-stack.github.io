<text x="395.0" y="491.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">is the API</text>
<rect x="470" y="450" width="130" height="56" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5" stroke-dasharray="6 4"/>
