baseURL = "https://grandstack.ai/"
locale = "en"
title = "GRANDstack"
enableRobotsTXT = true
disableKinds = ["taxonomy", "term"]
enableGitInfo = false

[params]
  description = "GraphQL and Neo4j, for developers and agents."
  githubOrg = "grand-stack"

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = false
    [markup.goldmark.parser]
      autoHeadingID = true
      autoHeadingIDType = "github"
  [markup.highlight]
    noClasses = false
    lineNos = false
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 3

[outputFormats]
  [outputFormats.LLMS]
    mediaType = "text/plain"
    baseName = "llms"
    isPlainText = true
    notAlternative = true
  [outputFormats.LLMSFULL]
    mediaType = "text/plain"
    baseName = "llms-full"
    isPlainText = true
    notAlternative = true

[outputs]
  home = ["HTML", "LLMS", "LLMSFULL"]

[menus]
  [[menus.main]]
    name = "Docs"
    url = "/docs/"
    weight = 10
  [[menus.main]]
    name = "Quickstart"
    url = "/quickstart/"
    weight = 20
  [[menus.main]]
    name = "Examples"
    url = "/examples/"
    weight = 30
  [[menus.main]]
    name = "Agents"
    url = "/agents/"
    weight = 40
