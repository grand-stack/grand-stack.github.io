<div id="consent" class="consent" role="region" aria-label="Cookie consent" hidden>
  <div class="consent-text">
    <p class="consent-title">We use cookies</p>
    <p>We use cookies and similar technologies, including your IP address for location, to understand how this site is used and which pages lead to GitHub. Nothing is sent until you accept. <a href="/privacy/">Read how we use your data</a>.</p>
  </div>
  <div class="consent-actions">
    <button type="button" class="consent-btn" data-consent="denied">Decline</button>
    <button type="button" class="consent-btn consent-accept" data-consent="granted">Accept</button>
  </div>
</div>
