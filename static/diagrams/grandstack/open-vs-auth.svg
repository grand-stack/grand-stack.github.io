<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1190 520" width="1190" height="520" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">What compose.auth.yaml changes: a gateway in front, Keycloak beside it, and the server no longer published</title><desc id="d">Left, the default stack: the browser calls the GraphQL server directly. Right, the auth stack: the browser calls a gateway that validates tokens, Keycloak issues them, the server is no longer reachable from the host, the web app is unchanged and now anonymous, and a demo client is added.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="1188.5" height="518.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<text x="220" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#0f2233">Default stack</text>
<text x="220" y="56" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">docker compose up</text>
<text x="820" y="36" font-size="16" font-weight="700" text-anchor="middle" fill="#0f2233">With compose.auth.yaml</text>
<text x="820" y="56" font-size="12" font-weight="400" text-anchor="middle" fill="#475569">docker compose -f compose.yaml -f compose.auth.yaml up</text>
