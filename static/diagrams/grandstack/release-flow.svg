<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" role="img" aria-labelledby="t d" font-family='system-ui, -apple-system, "Segoe UI", Roboto, sans-serif'><title id="t">What happens on a release: the button or a tag starts the release workflow, which publishes the GitHub Release and images and then tells the website and the integration test</title><desc id="d">A maintainer runs the release-cut workflow, or pushes a version tag by hand. The release workflow validates the tag, creates the GitHub Release, pushes container images to GHCR and sends a repo-released event. That event rebuilds and deploys the website (with an hourly fallback) and runs the integration test.</desc><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker><marker id="arrS" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs><rect x="0.75" y="0.75" width="998.5" height="518.5" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.5"/>
<rect x="24" y="40" width="220" height="80" rx="8" fill="#e3f1fa" stroke="#0a6190" stroke-width="1.5"/>
<text x="134.0" y="62" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">release-cut (the button)</text>
<text x="134.0" y="81.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">choose patch, minor, major</text>
<text x="134.0" y="97.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">or dry-run</text>
<rect x="290" y="40" width="240" height="80" rx="8" fill="#ffffff" stroke="#64748b" stroke-width="1.5"/>
<text x="410.0" y="62" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">cut-release</text>
<text x="410.0" y="81.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">CI green on main, next version,</text>
<text x="410.0" y="97.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">package.json, commit, tag, push</text>
<rect x="580" y="40" width="190" height="80" rx="8" fill="#e1f5ee" stroke="#0b8a6a" stroke-width="2.6"/>
<text x="675.0" y="62" font-size="13.5" font-weight="650" text-anchor="middle" fill="#0f2233">release workflow</text>
<text x="675.0" y="81.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">validates the tag and</text>
<text x="675.0" y="97.0" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">the package versions</text>
<rect x="810" y="40" width="166" height="80" rx="8" fill="#eef2f6" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="6 4"/>
<text x="893.0" y="62" font-size="13" font-weight="650" text-anchor="middle" fill="#0f2233">tag pushed by hand</text>
<text x="893.0" y="81.5" font-size="11.5" font-weight="400" text-anchor="middle" fill="#475569">vMAJOR.MINOR.PATCH</text>
