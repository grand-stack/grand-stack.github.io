<text x="550" y="84.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<circle cx="820" cy="64" r="11" fill="#0a6190"/>
<text x="820" y="68.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<circle cx="500" cy="314" r="11" fill="#0a6190"/>
<text x="500" y="318.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<circle cx="290" cy="450" r="11" fill="#0a6190"/>
<text x="290" y="454.5" font-size="13" font-weight="700" text-anchor="middle" fill="#ffffff">5</text>
